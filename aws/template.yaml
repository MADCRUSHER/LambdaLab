AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LambdaLab - real AWS Lambda + API Gateway + CloudWatch demonstration

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        POWERED_BY: LambdaLab

Resources:
  LambdaLabApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  LambdaLabFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LambdaLab-CalculateOrderTotal
      CodeUri: src/
      Handler: app.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
                - cloudwatch:ListMetrics
              Resource: '*'
            - Effect: Allow
              Action:
                - logs:FilterLogEvents
              Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/LambdaLab-CalculateOrderTotal:*
      Events:
        Invoke:
          Type: HttpApi
          Properties:
            ApiId: !Ref LambdaLabApi
            Path: /invoke
            Method: POST
        Functions:
          Type: HttpApi
          Properties:
            ApiId: !Ref LambdaLabApi
            Path: /functions
            Method: GET
        Analytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref LambdaLabApi
            Path: /analytics
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref LambdaLabApi
            Path: /health
            Method: GET

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${LambdaLabApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref LambdaLabFunction
  CloudWatchLogGroup:
    Description: Lambda CloudWatch log group
    Value: !Sub /aws/lambda/${LambdaLabFunction}
